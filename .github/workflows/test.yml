name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest-large
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version: "1.22"
    - name: Test
      run: |
        go test -v -race ./...
